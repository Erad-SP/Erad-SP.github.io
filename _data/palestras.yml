  - id: PI5
    date: "04/09/2026 - 10h30"
    name: "Palestra Industrial 5 (Dell)"
    title: "Dell AI Factory: O caminho para acelerar das ideias à inovação com IA e HPC"
    #abstract: ""
    speaker:
      name: "Leonardo Delatim"
      bio: "Leonardo Delatim é Senior Principal Engineer na Dell Technologies, com foco em workloads de Inteligência Artificial, HPC e Edge Computing no Brasil e na América Latina. Atua como trust advisor para clientes e parceiros, ajudando no desenvolvimento de soluções que facilitam a adoção de Edge Computing, Computer Vision, AI, GenAI e HPC. Com pós-graduação em Inteligência Artificial e formação técnica em Segurança da Informação e Análise de Sistemas, além de mais de 12 anos de experiência em tecnologia da informação, lidera conversas técnicas sobre arquiteturas, dimensionamento, melhores práticas, workshops, atividades hands-on e provas de conceito. Sua experiência combina infraestrutura de data center, cloud, armazenamento, virtualização e plataformas corporativas, apoiando casos de uso em diferentes segmentos de mercado e acelerando a transformação de ideias em inovação com IA e HPC."
      photo: "Leonardo-Delatim.jpeg"
  - id: P1
    date: "02/09/2026 - 14:00h"
    name: "Palestra Convidada 1"
    title: "Supercomputação no Brasil: máquinas se compram, capacidade se constrói"
    #abstract: ""
    speaker:
      name: "Prof. Pedro Leite da Silva Dias (IAG/USP)"
      bio: "Bacharel em Matemática Aplicada-IME-USP/1974, PhD em Ciências  Atmosféricas na Colorado State University-1979. Atualmente Professor Titular e no IAG/USP desde 1975. Diretor do IAG/USP (2017-2021), Diretor do LNCC/MCTI (2007-2015) e Chefe do CPTEC/INPE (1988-1990) e atualmente Diretor Geral do Centro de Supercomputação Científica do Estado de São Paulo (C3SP).  Membro titular da Academia Brasileira de Ciências e recebeu a Ordem do Mérito Científico do MCTI. Orientou cerca de 70 alunos de pós-graduação. Linha de pesquisa principal em dinâmica de fluidos geofísicos linear e não linear, aplicado a problemas tropicais e subtropicais. Experiência em Climatologia Dinâmica, Mudanças Climáticas, Previsão de Tempo e Clima, Computação de Alto Desempenho, Aplicações de Inteligência Artificial na Meteorologia e Gestão Científica."
      photo: "pedrodias.png"
  - id: P2
    date: "03/09/2026 - 14h"
    name: "Palestra Convidada 2"
    title: "Do plasma ao processamento paralelo: computação de alto desempenho no Laboratório de Astrofísica Teórica da EACH-USP"
    abstract: |
      A palestra apresentará como a computação de alto desempenho é utilizada no Laboratório de Astrofísica Teórica da EACH-USP para investigar problemas em astrofísica de plasmas. Inicialmente, será descrita a infraestrutura do cluster Hydra e o fluxo de trabalho adotado desde a formulação dos modelos físicos até a execução, análise e visualização dos resultados.

      Serão discutidas aplicações envolvendo simulações magnetohidrodinâmicas em três dimensões, estudos de estabilidade de sistemas linearizados, como a instabilidade de tearing, e análise e visualização de grandes volumes de dados científicos. Particular atenção será dada às estratégias de paralelização híbrida com MPI e OpenMP utilizadas nos códigos tridimensionais, incluindo decomposição de domínio, execução em memória compartilhada e comunicação entre nós.

      Pretendo também apresentar alguns resultados de desempenho e escalabilidade obtidos no cluster Hydra, caso consiga concluir os testes a tempo, comparando diferentes configurações de processos MPI e threads OpenMP. Serão discutidos os principais gargalos observados, especialmente os efeitos da comunicação entre os nós por meio da rede de 10 Gb/s e sua influência na eficiência paralela das simulações.

      Por fim, serão abordadas perspectivas para a evolução da infraestrutura e dos códigos científicos, incluindo o uso de GPUs e outros aceleradores, os desafios de adaptação dos algoritmos a arquiteturas heterogêneas e as possíveis aplicações de modelos de linguagem no desenvolvimento, documentação, teste e modernização de códigos de pesquisa.
    speaker:
      name: "Prof. Grzegorz Kowal (EACH/USP)"
      bio: "Grzegorz Kowal é professor associado da EACH-USP e pesquisador do Laboratório de Astrofísica Teórica. Doutor em Astronomia pela Universidade Jaguelônica, na Polônia, atua nas áreas de astrofísica computacional, turbulência magnetohidrodinâmica, reconexão magnética, instabilidades em plasmas e aceleração de partículas. Desenvolve e utiliza métodos numéricos, códigos paralelos e infraestruturas de computação de alto desempenho para simulações de plasmas astrofísicos em duas e três dimensões."
      photo: "grzegorz.png"
