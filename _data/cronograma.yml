      - title: "Palestra Convidada: Do plasma ao processamento paralelo: computação de alto desempenho no Laboratório de Astrofísica Teórica da EACH-USP"
        description: | 
          A palestra apresentará como a computação de alto desempenho é utilizada no Laboratório de Astrofísica Teórica da EACH-USP para investigar problemas em astrofísica de plasmas. Inicialmente, será descrita a infraestrutura do cluster Hydra e o fluxo de trabalho adotado desde a formulação dos modelos físicos até a execução, análise e visualização dos resultados.

          Serão discutidas aplicações envolvendo simulações magnetohidrodinâmicas em três dimensões, estudos de estabilidade de sistemas linearizados, como a instabilidade de tearing, e análise e visualização de grandes volumes de dados científicos. Particular atenção será dada às estratégias de paralelização híbrida com MPI e OpenMP utilizadas nos códigos tridimensionais, incluindo decomposição de domínio, execução em memória compartilhada e comunicação entre nós.

          Pretendo também apresentar alguns resultados de desempenho e escalabilidade obtidos no cluster Hydra, caso consiga concluir os testes a tempo, comparando diferentes configurações de processos MPI e threads OpenMP. Serão discutidos os principais gargalos observados, especialmente os efeitos da comunicação entre os nós por meio da rede de 10 Gb/s e sua influência na eficiência paralela das simulações.

          Por fim, serão abordadas perspectivas para a evolução da infraestrutura e dos códigos científicos, incluindo o uso de GPUs e outros aceleradores, os desafios de adaptação dos algoritmos a arquiteturas heterogêneas e as possíveis aplicações de modelos de linguagem no desenvolvimento, documentação, teste e modernização de códigos de pesquisa.
        link: "palestras.html#P1"
